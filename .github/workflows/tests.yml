name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - qgis/qgis:3.44
          - qgis/qgis:4.2
    steps:
      - uses: actions/checkout@v4

      - name: Run tests inside QGIS
        # Same script as `pixi run test-docker-qgis3` / `test-docker-qgis4`
        run: bash scripts/test_docker.sh ${{ matrix.image }}
